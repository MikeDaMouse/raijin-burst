    <style>html,body{background:#0b0614}#boot{z-index:2;color:#fff;background:radial-gradient(at 50% 55%,#22143e,#0b0614 72%);flex-direction:column;justify-content:center;align-items:center;gap:18px;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#boot .bt{letter-spacing:.04em;text-align:center;background:linear-gradient(#fff 20%,#4fe3ff 60%,#1a6dff);color:#0000;filter:drop-shadow(3px 3px #ff3c6e)drop-shadow(0 0 14px #4fe3ff73);-webkit-background-clip:text;background-clip:text;font:italic 900 clamp(34px,13vmin,84px)/.92 Impact,Arial Black,Helvetica Neue,sans-serif;transform:skew(-8deg)}#boot .bt span{display:block}#boot .bb{background:#ffffff24;width:min(46vmin,220px);height:6px;overflow:hidden;transform:skew(-24deg);box-shadow:inset 0 0 0 1.5px #fff}#boot .bb i{background:linear-gradient(90deg,#1a6dff,#4fe3ff,#fff);width:40%;height:100%;animation:1.1s ease-in-out infinite rbboot;display:block}@keyframes rbboot{0%{transform:translate(-110%)}to{transform:translate(260%)}}#boot .bm{opacity:.85;text-align:center;padding:0 24px;font:600 14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;display:none}#boot.slow .bm{display:block}</style>

  <body>
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="ui"></div>
    </div>
    <div id="boot" aria-label="Loading">
      <div class="bt"><span>RAIJIN</span><span>BURST</span></div>
      <div class="bb"><i></i></div>
      <div class="bm">Still loading... on a slow connection this can take a moment. Tap to reload.</div>
    </div>
    <noscript><div style="position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#0b0614;color:#fff;font:600 16px system-ui,sans-serif;text-align:center;padding:24px">RAIJIN BURST needs JavaScript.</div></noscript>
    <script>
      // If the game script never boots (very old browser, blocked, dead connection) the splash must not stay silent forever.
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (b) {
          b.className = 'slow';
          b.addEventListener('pointerup', function () { location.reload(); });
        }
      }, 20000);
    </script>
  </body>
